<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline - VIT ShuttleAI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #080c14;
      color: #eef2ff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    .offline-container {
      max-width: 420px;
    }
    .offline-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 1.5rem;
      border-radius: 50%;
      background: rgba(0, 212, 184, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      background: linear-gradient(135deg, #00d4b8, #7c6dfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #7a8ba8;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    button {
      padding: 0.75rem 2rem;
      background: linear-gradient(135deg, #00d4b8, #00b09c);
      color: #080c14;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 212, 184, 0.3);
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="offline-icon">🚌</div>
    <h1>You're Offline</h1>
    <p>It looks like you've lost your internet connection. VIT ShuttleAI needs a connection to show live shuttle positions.</p>
    <button onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
