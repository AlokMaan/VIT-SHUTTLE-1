services:
  - type: web
    name: vit-shuttle-backend
    env: node
    region: singapore
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      # Render Free does not reliably allow outbound SMTP. Use Brevo's HTTPS API
      # for OTP delivery instead, and add the key in the Render dashboard.
      - key: EMAIL_PROVIDER
        value: brevo
      - key: EMAIL_USER
        sync: false
      - key: BREVO_API_KEY
        sync: false
