services:
  - type: web
    name: vit-shuttle-backend
    env: node
    region: singapore
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      # Render Free does not reliably allow outbound SMTP. Gmail's HTTPS API
      # avoids SMTP timeouts and preserves a trusted Gmail sender for OTPs.
      - key: EMAIL_PROVIDER
        value: gmail-api
      - key: EMAIL_USER
        sync: false
      - key: GMAIL_API_CLIENT_ID
        sync: false
      - key: GMAIL_API_CLIENT_SECRET
        sync: false
      - key: GMAIL_API_REFRESH_TOKEN
        sync: false
